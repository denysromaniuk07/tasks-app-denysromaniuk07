name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{matrix.python-version}}
      - run: pip install -r services/${{matrix.service}}/requirements.txt
      - run: pytest -rA services/${{matrix.service}} > ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{matrix.service}}-${{matrix.python-version}} test report
          path: ${{matrix.service}}-${{matrix.python-version}}-test-report.txt
      - run: pip install bandit
      - run: bandit -r services/${{matrix.service}} -f html -o ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html
        continue-on-error: true
      - name: Upload Bandit Report as Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{matrix.service}}-${{matrix.python-version}}-bandit-report
          path: ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html

  build_images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ${{matrix.service}} services/${{matrix.service}}

  scan_images:
    needs: build_images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ${{matrix.service}} services/${{matrix.service}}
      # trivy-action v0.36.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{matrix.service}}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish_images:
    needs: scan_images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [tasks-api, title-normalizer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        env:
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{matrix.service}}"
          IMAGE_TAG="$IMAGE:${GITHUB_SHA}"
          docker build \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            -t "$IMAGE_TAG" "services/${{matrix.service}}"
          docker push "$IMAGE_TAG"

  smoke_test:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build
      - name: Wait for tasks-api
        run: |
          for i in $(seq 1 30); do
            curl -sf localhost:5000/health && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Create a task and check normalized
        run: |
          RESPONSE=$(curl -s -X POST localhost:5000/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title": "  buy   MILK "}')
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c 'import sys, json; sys.exit(0 if json.load(sys.stdin).get("normalized") is True else 1)'
      - if: always()
        run: docker compose down

  deploy:
    needs: run_tests
#    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: tasks-api-3.12-bandit-report
        path: _site
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: title-normalizer-3.12-bandit-report
        path: _site
    - run: mv _site/tasks-api-3.12-bandit-report.html _site/index.html
    - run: |
        cat > _site/index.html <<EOF
        <h1>Bandit Reports</h1>
        <p><a href="tasks-api-3.12-bandit-report.html">tasks-api</a></p>
        <p><a href="title-normalizer-3.12-bandit-report.html">title-normalizer</a></p>
        EOF
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: _site/
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      id: deployment

  checks_passed:
    needs: [run_tests, build_images, scan_images]
    # without this, a failed need would make this job skipped, and a skipped required check counts as passed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless run_tests, build_images and scan_images all succeeded
        if: needs.run_tests.result != 'success' || needs.build_images.result != 'success' || needs.scan_images.result != 'success'
        run: |
          echo "run_tests: ${{ needs.run_tests.result }}"
          echo "build_images: ${{ needs.build_images.result }}"
          echo "scan_images: ${{ needs.scan_images.result }}"
          exit 1