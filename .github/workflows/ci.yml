name: CI

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - run: pytest -rA -c "services/${{ matrix.service }}/pytest.ini" "services/${{ matrix.service }}/tests" | tee "${{ matrix.service }}-test-report.txt"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "${{ matrix.service }}-test-report"
          path: "${{ matrix.service }}-test-report.txt"

  deploy:
    needs: run tests
    runs-on: ubuntu-latest
    enviroment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    permissions:
      pages: write
      id_token: write
    steps:
      uses: actions/download-artifact@v7
      with:
        name: tasks-api-3.12-bandit-report
        path: _site
      run: ls _site
      uses: actions/upload-pages-artifact@v5
      with:
        path: site/
      uses: actions/deploy-page@v5
        id: deployment


