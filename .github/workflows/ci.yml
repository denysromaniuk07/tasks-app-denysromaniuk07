name: CI

on:
	push:
		branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      -	run: pip install -r services/tasks-api/requirements.txt 
      -	run: pytest -c services/tasks-api

